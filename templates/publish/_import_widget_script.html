{# Скрипт виджета загрузки. Подключается на верхнем уровне страницы (не внутри .adm-main) — иначе при переходах внутри раздела он не выполнится. #}
<script>
(function() {
    var TOKEN = {{ token|tojson }};
    var BASE = {{ url_for('admin_publish_import')|tojson }} + '/' + TOKEN;
    var DOC_RE = /\.(docx?|rtf)$/i, PDF_RE = /\.pdf$/i;
    var drop = document.getElementById('impDrop');
    if (!drop) return;
    var rowsEl = document.getElementById('impRows');
    var docs = {};      // имя файла -> {tr, data}
    var pdfByDoi = {};  // doi -> имя PDF
    var busy = false, created = false;

    function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
    }
    function mark(kind, text) { return el('span', 'pub-mark pub-mark-' + kind, text); }

    // --- отбор файлов: если есть подпапки doc и pdf, берём только их
    function pick(files) {
        var list = files.filter(function(f) {
            var n = f.file.name;
            return n.indexOf('~$') !== 0 && n.charAt(0) !== '.' && (DOC_RE.test(n) || PDF_RE.test(n));
        });
        function inDir(f, dir) { return f.path.toLowerCase().split('/').slice(0, -1).indexOf(dir) !== -1; }
        var hasDocDir = list.some(function(f) { return DOC_RE.test(f.file.name) && inDir(f, 'doc'); });
        var hasPdfDir = list.some(function(f) { return PDF_RE.test(f.file.name) && inDir(f, 'pdf'); });
        return list.filter(function(f) {
            if (DOC_RE.test(f.file.name)) return !hasDocDir || inDir(f, 'doc');
            return !hasPdfDir || inDir(f, 'pdf');
        });
    }

    function readEntries(items) {
        // Перетаскивание папки: обходим дерево через webkitGetAsEntry
        var out = [], pending = [];
        function walk(entry, prefix) {
            if (entry.isFile) {
                pending.push(new Promise(function(res) {
                    entry.file(function(file) { out.push({ file: file, path: prefix + file.name }); res(); }, res);
                }));
            } else if (entry.isDirectory) {
                var reader = entry.createReader();
                pending.push(new Promise(function(res) {
                    (function readBatch() {
                        reader.readEntries(function(batch) {
                            if (!batch.length) { res(); return; }
                            batch.forEach(function(e) { walk(e, prefix + entry.name + '/'); });
                            readBatch();
                        }, res);
                    })();
                }));
            }
        }
        for (var i = 0; i < items.length; i++) {
            var entry = items[i].webkitGetAsEntry && items[i].webkitGetAsEntry();
            if (entry) walk(entry, '');
        }
        function settle(n) {
            return Promise.all(pending).then(function() { return pending.length === n ? out : settle(pending.length); });
        }
        return settle(pending.length);
    }

    function addRow(name, kindText) {
        var tr = el('tr');
        var c = [el('td'), el('td', 'pub-cell-title', name), el('td', null, kindText), el('td', 'pub-num'), el('td', 'pub-num'), el('td', 'pub-num'), el('td')];
        c[0].appendChild(mark('wait', '…'));
        c.forEach(function(td) { tr.appendChild(td); });
        rowsEl.appendChild(tr);
        return { tr: tr, c: c };
    }
    function setMark(row, kind, text) { row.c[0].innerHTML = ''; row.c[0].appendChild(mark(kind, text)); }
    function addMsgs(td, items, cls) {
        if (!items || !items.length) return;
        var ul = td.querySelector('ul') || td.appendChild(el('ul', 'pub-msgs'));
        items.forEach(function(m) { ul.appendChild(el('li', cls, m)); });
    }

    function post(url, file) {
        var fd = new FormData();
        fd.append('file', file, file.name);
        return fetch(url, { method: 'POST', body: fd }).then(function(r) {
            return r.json().catch(function() { return { error: 'Сервер ответил с ошибкой ' + r.status }; })
                .then(function(d) { return { ok: r.ok, data: d }; });
        }).catch(function() { return { ok: false, data: { error: 'Не удалось отправить файл' } }; });
    }

    function refreshPdfColumn() {
        var articles = 0, withPdf = 0;
        Object.keys(docs).forEach(function(k) {
            var d = docs[k];
            if (!d.data || d.data.kind !== 'article') return;
            articles++;
            var pdf = pdfByDoi[(d.data.doi || '').toLowerCase()];
            d.row.c[6].textContent = pdf || '—';
            d.row.c[6].className = pdf ? '' : 'pub-cell-sub';
            if (pdf) withPdf++;
        });
        document.getElementById('impCounts').textContent = articles ? '· статей ' + articles + ', с PDF ' + withPdf : '';
        return { articles: articles, withPdf: withPdf };
    }

    function upload(files) {
        if (busy || created) return;
        files = pick(files);
        if (!files.length) { showToast('В выбранном нет файлов .doc или .pdf', 'error'); return; }
        busy = true;
        document.getElementById('impWork').style.display = '';
        var bar = document.getElementById('impBar'), text = document.getElementById('impProgressText');
        files.sort(function(a, b) { return a.file.name.localeCompare(b.file.name, 'ru'); });
        var docFiles = files.filter(function(f) { return DOC_RE.test(f.file.name); });
        var pdfFiles = files.filter(function(f) { return PDF_RE.test(f.file.name); });
        var queue = docFiles.concat(pdfFiles), done = 0;

        function next() {
            if (!queue.length) { finish(); return; }
            var f = queue.shift(), isDoc = DOC_RE.test(f.file.name);
            text.textContent = (isDoc ? 'Разбираю ' : 'Загружаю ') + f.file.name + ' — ' + (done + 1) + ' из ' + (done + queue.length + 1);
            var row = isDoc ? addRow(f.file.name, '') : null;
            post(BASE + (isDoc ? '/doc' : '/pdf'), f.file).then(function(res) {
                var d = res.data;
                if (isDoc) {
                    docs[f.file.name] = { row: row, data: res.ok ? d : null };
                    if (!res.ok || d.kind === 'error') {
                        setMark(row, 'bad', '!'); row.c[2].textContent = (d.error || d.reason || 'ошибка');
                    } else if (d.kind === 'skipped') {
                        setMark(row, 'wait', '–'); row.c[2].textContent = d.reason; row.c[2].className = 'pub-cell-sub';
                    } else {
                        setMark(row, d.warnings.length ? 'warn' : 'ok', d.warnings.length ? '!' : '✓');
                        row.c[2].textContent = d.title;
                        row.c[2].appendChild(el('div', 'pub-cell-sub', d.authors.join(', ') + ' · ' + d.doi));
                        addMsgs(row.c[2], d.warnings, 'pub-msg-warn');
                        row.c[3].textContent = d.pages;
                        row.c[4].textContent = d.authors.length;
                        row.c[5].textContent = d.refs + ' / ' + d.refs_en;
                    }
                } else if (res.ok && d.doi) {
                    pdfByDoi[d.doi.toLowerCase()] = d.file;
                } else if (res.ok && d.toc) {
                    var rt = addRow(f.file.name, 'Титул выпуска: найдено разделов — ' + d.toc.sections);
                    setMark(rt, d.toc.warnings.length ? 'warn' : 'ok', d.toc.warnings.length ? '!' : '✓');
                    addMsgs(rt.c[2], d.toc.warnings, 'pub-msg-warn');
                } else if (!res.ok) {
                    var r2 = addRow(f.file.name, d.error || 'ошибка'); setMark(r2, 'bad', '!');
                }
                done++;
                bar.style.width = Math.round(100 * done / (done + queue.length)) + '%';
                refreshPdfColumn();
                next();
            });
        }

        function finish() {
            busy = false;
            var c = refreshPdfColumn();
            text.textContent = 'Загружено: статей ' + c.articles + ', PDF к ним ' + c.withPdf + '.';
            fetch(BASE + '/summary').then(function(r) { return r.json(); }).then(showIssue);
        }
        next();
    }

    function showIssue(s) {
        var card = document.getElementById('impIssueCard'), note = document.getElementById('impIssueNote');
        card.style.display = '';
        note.innerHTML = '';
        if (!s.issue) {
            note.appendChild(el('div', 'pub-warning-box', 'Среди файлов не нашлось ни одной статьи с DOI — создавать выпуск не из чего.'));
            document.getElementById('impCreate').disabled = true;
            return;
        }
        document.getElementById('impJournal').value = s.issue.journal_name || '';
        document.getElementById('impIssn').value = s.issue.issn;
        document.getElementById('impYear').value = s.issue.year;
        document.getElementById('impNumber').value = s.issue.number;
        document.getElementById('impVolume').value = s.issue.volume || '';
        if (s.other_issue_files && s.other_issue_files.length) {
            note.appendChild(el('div', 'pub-warning-box', 'Эти статьи, судя по DOI, из другого выпуска: ' + s.other_issue_files.join(', ') + '. Они тоже попадут в создаваемый выпуск — уберите лишнее и загрузите заново, если это ошибка.'));
        }
        if (s.existing_url) {
            var ex = s.existing || {};
            var box = el('div', 'pub-warning-box', 'Такой выпуск уже есть в разделе' + (ex.articles ? ' (статей: ' + ex.articles + ')' : '') + '. ');
            box.appendChild(document.createTextNode(ex.blocked
                ? ex.blocked
                : 'Можно открыть его или заменить новой загрузкой: прежний черновик будет удалён вместе с его PDF.'));
            var acts = el('div', 'pub-actions', null);
            acts.style.margin = '12px 0 0';
            var open = el('a', 'pub-btn pub-btn-secondary pub-btn-sm', 'Открыть существующий'); open.href = s.existing_url;
            acts.appendChild(open);
            if (ex.missing && ex.missing.length) {
                var app = el('button', 'pub-btn pub-btn-primary pub-btn-sm', 'Дополнить выпуск недостающими статьями (' + ex.missing.length + ')'); app.type = 'button';
                app.title = ex.missing.join('\n');
                app.addEventListener('click', function() {
                    if (confirm('Добавить в выпуск только статьи, которых в нём нет:\n\n' + ex.missing.join('\n') +
                            '\n\nУже лежащие в выпуске статьи, их правки, запись на сайт и отправка в Метафору не изменятся.')) createIssue(app, false, true);
                });
                acts.appendChild(app);
            }
            if (!ex.blocked) {
                var rep = el('button', 'pub-btn pub-btn-danger pub-btn-sm', 'Заменить новой загрузкой'); rep.type = 'button';
                rep.addEventListener('click', function() {
                    if (confirm('Заменить выпуск? Прежний черновик (статьи, разделы, PDF) будет удалён, вместо него создастся новый из загруженных файлов.')) createIssue(rep, true);
                });
                acts.appendChild(rep);
            }
            box.appendChild(acts);
            note.appendChild(box);
            document.getElementById('impCreate').disabled = true;
        }
        var c = refreshPdfColumn();
        if (s.sections && s.sections.length) {
            note.appendChild(el('div', 'pub-note-box', 'Разделы выпуска из титульного PDF (' + s.sections.length + '): ' + s.sections.join('; ') + '. Статьи распределятся по ним сами — по первой странице.'));
        }
        if (c.articles && c.withPdf < c.articles) {
            note.appendChild(el('div', 'pub-note-box', 'PDF есть не у всех статей (' + c.withPdf + ' из ' + c.articles + '). Выпуск создать можно, недостающие PDF добавляются на его странице — без них сверка и отправка в Метафору для этих статей невозможны.'));
        }
    }

    function createIssue(btn, replace, append) {
        btn.disabled = true;
        fetch(BASE + '/create', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                journal_name: document.getElementById('impJournal').value, issn: document.getElementById('impIssn').value,
                year: document.getElementById('impYear').value, number: document.getElementById('impNumber').value,
                volume: document.getElementById('impVolume').value, replace: !!replace, append: !!append,
            }),
        }).then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
          .then(function(res) {
              if (res.ok) { created = true; window.location.href = res.data.url; return; }
              btn.disabled = false;
              showToast(res.data.error || 'Не удалось создать выпуск', 'error');
          }).catch(function() { btn.disabled = false; showToast('Не удалось создать выпуск', 'error'); });
    }
    document.getElementById('impCreate').addEventListener('click', function() { createIssue(this, false); });

    document.getElementById('impCancel').addEventListener('click', function() {
        fetch(BASE + '/cancel', { method: 'POST' }).then(function() { window.location.href = {{ url_for('admin_publish_index')|tojson }}; });
    });

    var inFiles = document.getElementById('impFiles'), inFolder = document.getElementById('impFolder');
    document.getElementById('impPickFiles').addEventListener('click', function(e) { e.stopPropagation(); inFiles.click(); });
    document.getElementById('impPickFolder').addEventListener('click', function(e) { e.stopPropagation(); inFolder.click(); });
    drop.addEventListener('click', function(e) { if (e.target === drop || e.target.closest('.pub-drop-icon, .pub-drop-title, .pub-drop-text')) inFolder.click(); });
    function fromInput(input) {
        var list = Array.prototype.map.call(input.files, function(f) { return { file: f, path: f.webkitRelativePath || f.name }; });
        input.value = '';
        upload(list);
    }
    inFiles.addEventListener('change', function() { fromInput(inFiles); });
    inFolder.addEventListener('change', function() { fromInput(inFolder); });
    // Файлы принимаются в ЛЮБОМ месте страницы: если бросить мимо рамки, браузер по умолчанию
    // открывает файл вместо страницы, и загрузка выглядит сломанной. Поэтому слушаем window.
    function hasFiles(e) {
        var t = e.dataTransfer && e.dataTransfer.types;
        return !!t && Array.prototype.indexOf.call(t, 'Files') !== -1;
    }
    var dragDepth = 0;
    function onEnter(e) {
        if (!hasFiles(e)) return;
        dragDepth++;
        drop.classList.add('pub-drop-active');
    }
    function onLeave(e) {
        if (!hasFiles(e)) return;
        dragDepth = Math.max(0, dragDepth - 1);
        if (!dragDepth) drop.classList.remove('pub-drop-active');
    }
    function onOver(e) {
        if (!hasFiles(e)) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
    }
    function onDrop(e) {
        if (!hasFiles(e)) return;
        e.preventDefault();
        dragDepth = 0;
        drop.classList.remove('pub-drop-active');
        var items = e.dataTransfer.items;
        if (items && items.length && items[0].webkitGetAsEntry) {
            readEntries(items).then(upload);
        } else {
            upload(Array.prototype.map.call(e.dataTransfer.files, function(f) { return { file: f, path: f.name }; }));
        }
    }
    window.addEventListener('dragenter', onEnter);
    window.addEventListener('dragleave', onLeave);
    window.addEventListener('dragover', onOver);
    window.addEventListener('drop', onDrop);
    // После перехода по ссылке внутри раздела страница не перезагружается, и обработчики прошлой
    // страницы остались бы на window — снимаем их, когда этой страницы уже нет.
    var cleanup = setInterval(function() {
        if (document.getElementById('impDrop') === drop) return;
        clearInterval(cleanup);
        window.removeEventListener('dragenter', onEnter);
        window.removeEventListener('dragleave', onLeave);
        window.removeEventListener('dragover', onOver);
        window.removeEventListener('drop', onDrop);
    }, 1000);
})();
</script>
