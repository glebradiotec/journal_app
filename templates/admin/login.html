<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 Админ вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <style>
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card { 
            max-width: 420px; 
            width: 100%; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .login-card .card {
            border: none;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.95);
        }
        .btn-login {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            font-weight: 600;
        }
        .login-hint {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <!-- Кнопка на главную -->
    <a href="/" class="btn btn-light" style="position: fixed; top: 20px; left: 20px; z-index: 1000;">🏠 На главную</a>
    
    <div class="login-container">
        <div class="login-card p-4">
            <div class="card">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h2 class="text-primary mb-1">👑 Админ-панель</h2>
                        <p class="text-muted">Войдите для управления контентом</p>
                    </div>
                    
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ 'danger' if category == 'danger' else category }} alert-dismissible fade show mb-4">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}
                    
                    <form method="POST">
                        <div class="mb-4">
                            <label class="form-label fw-bold">Логин</label>
                            <input type="text" name="username" class="form-control form-control-lg" 
                                   placeholder="admin" value="admin" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Пароль</label>
                            <input type="password" name="password" class="form-control form-control-lg" 
                                   placeholder="admin2026" required>
                        </div>
                        <button type="submit" class="btn btn-login btn-lg w-100 py-3 mb-3">
                            🚀 Войти в админку
                        </button>
                    </form>
                    
                    <div class="login-hint text-center">
                        <small class="text-muted">
                            💡 <strong>admin</strong> / <strong>admin2026</strong>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
