# X-Accel-Redirect: раздача файлов статей через Nginx (быстрее, не блокирует Gunicorn)
#
# 1. Добавьте этот блок ВНУТРИ server { ... } в конфиге Nginx:
#    /etc/nginx/sites-available/default или /etc/nginx/conf.d/journal_app.conf
#
# 2. Добавьте в journal.service (systemd):
#    Environment="USE_X_ACCEL_REDIRECT=1"
#
# 3. Перезапустите:
#    sudo nginx -t && sudo systemctl reload nginx
#    sudo systemctl restart journal.service

location /internal-uploads/ {
    internal;
    alias /var/www/journal_app/uploads/articles/;
    add_header Content-Disposition 'attachment';
}
