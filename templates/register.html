<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Научные журналы</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: var(--color-canvas-default);
            color: var(--color-fg-default);
            padding: 20px;
        }
        .login-wrapper { max-width: 400px; width: 100%; opacity: 0; transform: translateY(16px); animation: loginFadeIn 0.5s ease-out 0.1s forwards; }
        @keyframes loginFadeIn { to { opacity: 1; transform: translateY(0); } }
        .login-header { text-align: center; margin-bottom: 32px; }
        .login-logo { display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; background: linear-gradient(135deg, #5BA4B0 0%, #4A8E99 100%); border-radius: 16px; margin-bottom: 20px; box-shadow: 0 8px 24px rgba(91, 164, 176, 0.3); }
        .login-logo svg { color: #fff; }
        .login-header h1 { font-size: 22px; font-weight: 700; color: var(--color-fg-default); margin-bottom: 6px; }
        .login-header p { font-size: 14px; color: var(--color-fg-muted); }
        .login-card { background: var(--color-canvas-default); border: 1px solid var(--color-border-default); border-radius: 14px; padding: 28px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06); }
        .login-flash { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
        .login-flash-error { background: rgba(207, 34, 46, 0.08); color: #cf222e; border: 1px solid rgba(207, 34, 46, 0.2); }
        .login-flash-success { background: rgba(31, 136, 61, 0.08); color: #1a7f37; border: 1px solid rgba(31, 136, 61, 0.2); }
        .login-form { display: flex; flex-direction: column; gap: 18px; }
        .login-field { display: flex; flex-direction: column; gap: 6px; }
        .login-field label { font-size: 13px; font-weight: 600; color: var(--color-fg-default); }
        .login-input { padding: 11px 14px; font-size: 15px; color: var(--color-fg-default); background: var(--color-canvas-subtle); border: 1px solid var(--color-border-default); border-radius: 10px; outline: none; transition: border-color 0.2s, box-shadow 0.2s; font-family: inherit; }
        .login-input:focus { border-color: #5BA4B0; box-shadow: 0 0 0 3px rgba(91, 164, 176, 0.15); background: var(--color-canvas-default); }
        .login-input::placeholder { color: var(--color-fg-muted); opacity: 0.6; }
        .login-btn { padding: 12px; font-size: 15px; font-weight: 600; color: #fff; background: linear-gradient(135deg, #5BA4B0 0%, #4A8E99 100%); border: none; border-radius: 10px; cursor: pointer; transition: box-shadow 0.2s, transform 0.15s; font-family: inherit; margin-top: 4px; }
        .login-btn:hover { box-shadow: 0 4px 16px rgba(91, 164, 176, 0.4); transform: translateY(-1px); }
        .login-register-link { display: block; text-align: center; margin-top: 14px; font-size: 14px; color: var(--color-fg-muted); text-decoration: none; transition: color 0.2s; }
        .login-register-link:hover { color: #5BA4B0; }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-header">
            <div class="login-logo">
                <svg width="30" height="30" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M0 1.75A.75.75 0 0 1 .75 1h4.253c1.227 0 2.317.59 3 1.501A3.743 3.743 0 0 1 11.006 1h4.245a.75.75 0 0 1 .75.75v10.5a.75.75 0 0 1-.75.75h-4.507a2.25 2.25 0 0 0-1.591.659l-.622.621a.75.75 0 0 1-1.06 0l-.622-.621A2.25 2.25 0 0 0 5.258 13H.75a.75.75 0 0 1-.75-.75Zm7.251 10.324.004-5.073-.002-2.253A2.25 2.25 0 0 0 5.003 2.5H1.5v9h3.757a3.75 3.75 0 0 1 1.994.574ZM8.755 4.75l-.004 7.322a3.752 3.752 0 0 1 1.992-.572H14.5v-9h-3.495a2.25 2.25 0 0 0-2.25 2.25Z"/>
                </svg>
            </div>
            <h1>Регистрация автора</h1>
            <p>Создайте аккаунт для подачи статей в журналы</p>
        </div>
        <div class="login-card">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                    <div class="login-flash login-flash-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            <form method="POST" class="login-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="login-field">
                    <label for="username">Логин *</label>
                    <input type="text" id="username" name="username" class="login-input" placeholder="Логин для входа" autocomplete="username" required>
                </div>
                <div class="login-field">
                    <label for="display_name">ФИО или имя *</label>
                    <input type="text" id="display_name" name="display_name" class="login-input" placeholder="Как к вам обращаться" required>
                </div>
                <div class="login-field">
                    <label for="password">Пароль *</label>
                    <input type="password" id="password" name="password" class="login-input" placeholder="Не менее 6 символов" autocomplete="new-password" required minlength="6">
                </div>
                <button type="submit" class="login-btn">Зарегистрироваться</button>
                <a href="{{ url_for('login') }}" class="login-register-link">Уже есть аккаунт? Войти</a>
            </form>
        </div>
    </div>
</body>
</html>
