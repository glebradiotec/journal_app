<div class="gh-header-wrapper">
<header class="gh-header">
    <nav class="gh-header-nav">
        <div class="gh-header-left">
            <a href="{{ url_for('author.index') if (current_user.is_authenticated and current_user.role == 'author') else '/' }}" class="gh-header-home-btn" id="home-btn" title="На главную">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M6.906.664a1.749 1.749 0 0 1 2.187 0l5.25 4.2c.415.332.657.835.657 1.367v7.019A1.75 1.75 0 0 1 13.25 15h-3.5a.75.75 0 0 1-.75-.75V9H7v5.25a.75.75 0 0 1-.75.75h-3.5A1.75 1.75 0 0 1 1 13.25V6.23c0-.531.242-1.034.657-1.366l5.25-4.2Zm1.25 1.171a.25.25 0 0 0-.312 0l-5.25 4.2a.25.25 0 0 0-.094.196v7.019c0 .138.112.25.25.25H5.5V8.25a.75.75 0 0 1 .75-.75h3.5a.75.75 0 0 1 .75.75v5.25h2.75a.25.25 0 0 0 .25-.25V6.23a.25.25 0 0 0-.094-.195Z"/>
                </svg>
                <span>На главную</span>
            </a>
        </div>
        
        <div class="gh-header-right">
            {% if current_user.is_authenticated and current_user.is_admin %}
            <a href="/admin" class="gh-header-admin-btn" id="admin-btn" title="Админ-панель">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311c.446.82.023 1.841-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872l-.1-.34zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.858z"/>
                </svg>
            </a>
            {% endif %}
            {% if current_user.is_authenticated %}
            <a href="/logout" class="gh-header-user-btn" title="Выйти ({{ current_user.display_name }})">
                <span class="gh-header-username">{{ current_user.display_name }}</span>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M2 2.75C2 1.784 2.784 1 3.75 1h2.5a.75.75 0 0 1 0 1.5h-2.5a.25.25 0 0 0-.25.25v10.5c0 .138.112.25.25.25h2.5a.75.75 0 0 1 0 1.5h-2.5A1.75 1.75 0 0 1 2 13.25Zm10.44 4.5-1.97-1.97a.749.749 0 0 1 .326-1.275.749.749 0 0 1 .734.215l3.25 3.25a.75.75 0 0 1 0 1.06l-3.25 3.25a.749.749 0 0 1-1.275-.326.749.749 0 0 1 .215-.734l1.97-1.97H6.75a.75.75 0 0 1 0-1.5Z"/>
                </svg>
            </a>
            {% endif %}
            <button id="theme-toggle" class="gh-header-btn" title="Переключить тему">
                <span id="theme-icon">🌙</span>
            </button>
        </div>
    </nav>
</header>
</div>

<style>
.gh-header-wrapper {
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 12px 24px;
    background: transparent;
}

.gh-header {
    max-width: 1216px;
    margin: 0 auto;
    height: 56px;
    display: flex;
    align-items: center;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    background: rgba(255, 255, 255, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.5);
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0, 0, 0, 0.04);
}

[data-theme="dark"] .gh-header {
    background: rgba(30, 35, 42, 0.65);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3), 0 1px 2px rgba(0, 0, 0, 0.2);
}

.gh-header-nav {
    width: 100%;
    padding: 0 20px;
    box-sizing: border-box;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.gh-header-left {
    display: flex;
    align-items: center;
}

.gh-header-home-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    color: #5BA4B0;
    background: rgba(91, 164, 176, 0.1);
    border: none;
    border-radius: 10px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
}

.gh-header-home-btn:hover {
    color: #fff;
    background: #5BA4B0;
    box-shadow: 0 4px 12px rgba(91, 164, 176, 0.35);
}

[data-theme="dark"] .gh-header-home-btn {
    color: #7CC5D0;
    background: rgba(124, 197, 208, 0.15);
}

[data-theme="dark"] .gh-header-home-btn:hover {
    color: #fff;
    background: #5BA4B0;
    box-shadow: 0 4px 12px rgba(31, 111, 235, 0.4);
}

.gh-header-home-btn svg {
    flex-shrink: 0;
}

.gh-header-right {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-left: auto;
}

.gh-header-admin-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    color: #555;
    background: rgba(0, 0, 0, 0.04);
    border: none;
    border-radius: 10px;
    text-decoration: none;
    transition: all 0.2s;
}

.gh-header-admin-btn:hover {
    color: #333;
    background: rgba(0, 0, 0, 0.08);
}

[data-theme="dark"] .gh-header-admin-btn {
    color: #aaa;
    background: rgba(255, 255, 255, 0.08);
}

[data-theme="dark"] .gh-header-admin-btn:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.15);
}

.gh-header-admin-btn svg {
    transition: transform 0.4s ease;
}

.gh-header-admin-btn:hover svg {
    transform: rotate(90deg);
}

.gh-header-username {
    font-size: 13px;
    font-weight: 600;
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.gh-header-user-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 14px;
    height: 38px;
    color: #5BA4B0;
    background: rgba(91, 164, 176, 0.08);
    border: none;
    border-radius: 10px;
    text-decoration: none;
    transition: all 0.2s;
}

.gh-header-user-btn:hover {
    color: #fff;
    background: rgba(207, 34, 46, 0.8);
}

[data-theme="dark"] .gh-header-user-btn {
    color: #7CC5D0;
    background: rgba(124, 197, 208, 0.12);
}

[data-theme="dark"] .gh-header-user-btn:hover {
    color: #fff;
    background: rgba(248, 81, 73, 0.7);
}

.gh-header-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    background: rgba(0, 0, 0, 0.04);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    color: #555;
    transition: all 0.2s;
}

.gh-header-btn:hover {
    color: #333;
    background: rgba(0, 0, 0, 0.08);
}

[data-theme="dark"] .gh-header-btn {
    color: #aaa;
    background: rgba(255, 255, 255, 0.08);
}

[data-theme="dark"] .gh-header-btn:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.15);
}

@media (max-width: 768px) {
    .gh-header-wrapper {
        padding: 8px 12px;
    }
    .gh-header {
        height: 48px;
        border-radius: 12px;
    }
    .gh-header-nav {
        padding: 0 12px;
    }
    .gh-header-home-btn {
        padding: 6px 10px;
    }
    .gh-header-home-btn span {
        display: none;
    }
    .gh-header-admin-btn,
    .gh-header-btn {
        width: 34px;
        height: 34px;
    }
}
</style>

<script>
    // Скрываем кнопку "На главную" на главной странице и в кабинете автора (уже там)
    var path = window.location.pathname;
    if (path === '/' || path === '/author' || path === '/author/') {
        var homeBtn = document.getElementById('home-btn');
        if (homeBtn) homeBtn.style.display = 'none';
    }
    // Скрываем кнопку "Админ-панель" на страницах кроме главной
    var adminBtn = document.getElementById('admin-btn');
    if (adminBtn && window.location.pathname !== '/') {
        adminBtn.style.display = 'none';
    }

    // Загружаем сохранённую тему при загрузке страницы
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeIcon(savedTheme);

    // Переключение темы при клике на кнопку
    document.getElementById('theme-toggle').addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        const newTheme = current === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateThemeIcon(newTheme);
    });

    // Обновляем иконку в зависимости от темы
    function updateThemeIcon(theme) {
        document.getElementById('theme-icon').textContent = theme === 'dark' ? '☀️' : '🌙';
    }
</script>
